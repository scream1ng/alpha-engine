<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha Engine</title>
<style>
/* ── RESET ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #ffffff;
  --bg2:      #f6f8fa;
  --bg3:      #eaeef2;
  --border:   #d0d7de;
  --text:     #1f2328;
  --text2:    #656d76;
  --text3:    #8c959f;
  --accent:   #0969da;
  --green:    #1a7f37;
  --red:      #cf222e;
  --yellow:   #9a6700;
  --up-bg:#dafbe1;  --up-bdr:#82cfaa;  --up-fg:#1a7f37;
  --ch-bg:#fff8c5;  --ch-bdr:#d4a72c;  --ch-fg:#9a6700;
  --dn-bg:#ffebe9;  --dn-bdr:#ffb8b0;  --dn-fg:#cf222e;
}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.skip-link{position:absolute;left:12px;top:-40px;padding:8px 12px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;z-index:10}
.skip-link:focus-visible{top:12px}

/* ── NAV ──────────────────────────────────────────── */
#nav{border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0}
#nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;min-height:48px;display:flex;align-items:center;gap:16px}
#nav-logo{font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px;user-select:none;flex-shrink:0;display:flex;align-items:center;gap:6px}
#nav-logo .alpha-sym{font-size:16px;color:var(--accent);font-weight:900;letter-spacing:-1px}
#nav-tabs{flex:1;display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.nav-tab{padding:0 16px;height:48px;display:flex;align-items:center;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;text-decoration:none;transition:color .15s;white-space:nowrap}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.nav-tab.dim{color:var(--text3);cursor:default;pointer-events:none}
#subnav{border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
#subnav-inner{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.subnav-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.subnav-meta .meta-label{font-weight:700;color:var(--text2);letter-spacing:.4px;text-transform:uppercase;font-size:10px}
.meta-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg);min-height:30px}
.regime-badge{padding:3px 10px;border-radius:12px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.regime-badge.uptrend  {background:var(--up-bg);color:var(--up-fg);border:1px solid var(--up-bdr)}
.regime-badge.choppy   {background:var(--ch-bg);color:var(--ch-fg);border:1px solid var(--ch-bdr)}
.regime-badge.downtrend{background:var(--dn-bg);color:var(--dn-fg);border:1px solid var(--dn-bdr)}
.market-switch{display:flex;align-items:center;gap:6px}
.market-pill{border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:999px;padding:6px 10px;font:600 11px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
.market-pill:hover{border-color:var(--accent);color:var(--accent)}
.market-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── PAGE ─────────────────────────────────────────── */
#page{flex:1;overflow-y:auto;min-height:0}
#page.chart-mode{overflow:hidden;display:flex;flex-direction:column}

/* ── OVERVIEW ─────────────────────────────────────── */
.ov-bar{border-bottom:1px solid var(--border);background:var(--bg2)}
.ov-bar h2{font-size:14px;font-weight:600;width:100%;text-align:center}
.ov-bar .sub{font-size:12px;color:var(--text2)}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 20px;align-items:start;max-width:1200px;margin:0 auto;width:100%}
.ov-bar>.ov-inner{max-width:1200px;margin:0 auto;width:100%;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.regime-col{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.regime-col.active-col{box-shadow:0 0 0 2px var(--accent)}
.rcol-hdr{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.rcol-hdr.uptrend  {background:var(--up-bg)}
.rcol-hdr.choppy   {background:var(--ch-bg)}
.rcol-hdr.downtrend{background:var(--dn-bg)}
.rcol-title{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.rcol-title.uptrend  {color:var(--up-fg)}
.rcol-title.choppy   {color:var(--ch-fg)}
.rcol-title.downtrend{color:var(--dn-fg)}
.active-mark{font-size:9px;padding:2px 6px;background:var(--accent);color:#fff;border-radius:8px;font-weight:700;letter-spacing:.3px}
.rcol-ct{margin-left:auto;font-size:11px;color:var(--text2)}
.rcol-body{padding:8px;display:flex;flex-direction:column;gap:5px}
.strat-card{display:block;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:inherit;text-decoration:none}
.strat-card.clickable{cursor:pointer;transition:box-shadow .1s,background .1s}
.strat-card.clickable:hover{background:var(--bg2);box-shadow:0 2px 8px rgba(9,105,218,.15);border-color:#0969da66}
.strat-card.pass{border-left:3px solid var(--green)}
.strat-card.fail{border-left:3px solid var(--text3);opacity:.45}
.sc-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.badge{font-size:9px;padding:2px 6px;border-radius:8px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.badge.pass{background:#dafbe1;color:var(--green);border:1px solid #82cfaa}
.badge.fail{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.sc-metrics{display:flex;gap:14px;flex-wrap:wrap}
.sc-m .sc-ml{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.sc-m .sc-mv{font-family:monospace;font-weight:600;font-size:13px}
.sc-mv.pos{color:var(--green)}.sc-mv.neg{color:var(--red)}.sc-mv.neu{color:var(--text)}
.no-edge{padding:16px;text-align:center;font-size:12px;color:var(--text3);font-style:italic}

/* ── SHARED HDR ───────────────────────────────────── */
.pg-hdr{border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;position:sticky;top:0;z-index:2}
.pg-hdr-inner{max-width:1200px;margin:0 auto;width:100%;padding:10px 20px;display:flex;align-items:center;position:relative}
#chart-page .pg-hdr{display:flex;align-items:center;padding:8px 14px;position:relative}
.back-btn{font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);transition:color .12s,background-color .12s,border-color .12s;flex-shrink:0}
.back-btn:hover{color:var(--text);background:var(--bg3);border-color:var(--text3)}
.pg-title{font-size:15px;font-weight:600;white-space:nowrap}
.pg-hdr-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pill.uptrend  {background:var(--up-bg);color:var(--up-fg);border:1px solid var(--up-bdr)}
.pill.choppy   {background:var(--ch-bg);color:var(--ch-fg);border:1px solid var(--ch-bdr)}
.pill.downtrend{background:var(--dn-bg);color:var(--dn-fg);border:1px solid var(--dn-bdr)}

/* ── STRATEGY DETAIL ──────────────────────────────── */
.pg-body{padding:16px 20px 32px;display:flex;flex-direction:column;gap:12px;max-width:1200px;margin:0 auto;width:100%}
.card{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-hdr{padding:8px 14px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);background:var(--bg2)}
.card-body{padding:14px}
/* metrics */
.met-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:10px}
.m-item{display:flex;flex-direction:column;gap:1px}
.m-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.m-val{font-size:22px;font-weight:700;font-family:monospace}
.m-val.pos{color:var(--green)}.m-val.neg{color:var(--red)}.m-val.neu{color:var(--text)}
.m-note{font-size:10px;color:var(--text3)}
.combo-tag{font-size:10px;color:var(--text2);font-family:monospace;background:var(--bg2);padding:3px 8px;border-radius:4px;border:1px solid var(--border);display:inline-block;word-break:break-all;margin-top:6px}
/* param section */
.param-section{margin-bottom:14px}
.param-section:last-child{margin-bottom:0}
.param-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:7px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.param-grid{display:flex;flex-direction:column;gap:0}
.param-row{display:flex;align-items:baseline;gap:0;padding:5px 0;border-bottom:1px solid var(--border)}
.param-row:last-child{border-bottom:none;padding-bottom:0}
.pk{font-size:11px;font-weight:600;min-width:140px;flex-shrink:0;font-family:monospace;color:var(--text)}
.pv{font-size:11px;font-family:monospace;color:var(--accent);font-weight:600;min-width:90px;flex-shrink:0}
.pd{font-size:11px;color:var(--text2);flex:1}
/* year bars */
.yr-bars{display:flex;flex-direction:column;gap:6px}
.yr-row{display:flex;align-items:center;gap:8px}
.yr-lbl{font-size:11px;color:var(--text2);width:38px;flex-shrink:0;font-family:monospace}
.yr-wrap{flex:1;background:var(--bg3);border-radius:2px;height:14px;overflow:hidden}
.yr-bar.pos{height:100%;background:#b7e5c6;border-radius:2px}
.yr-bar.neg{height:100%;background:#ffc1bd;border-radius:2px}
.yr-val{font-size:11px;font-family:monospace;font-weight:600;width:56px;text-align:right;flex-shrink:0}
.yr-val.pos{color:var(--green)}.yr-val.neg{color:var(--red)}
.yr-tc{font-size:10px;color:var(--text3);width:56px;flex-shrink:0}
/* year accordion */
.yr-accord{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:6px}
.yr-accord:last-child{margin-bottom:0}
.yr-head{width:100%;padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--bg2);user-select:none;transition:background .1s;border:0;text-align:left;font:inherit;color:inherit}
.yr-head:hover{background:var(--bg3)}
.yr-head .yr-yr{font-size:14px;font-weight:700;min-width:46px}
.yr-head .yr-meta{font-size:11px;color:var(--text2);flex:1}
.yr-head .yr-pnl{font-size:12px;font-family:monospace;font-weight:700}
.yr-head .yr-arr{font-size:10px;color:var(--text3);margin-left:6px;transition:transform .2s;display:inline-block}
.yr-head.open .yr-arr{transform:rotate(180deg)}
.yr-body{display:none}
.yr-body.open{display:block;max-height:600px;overflow-y:auto}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)}
td{padding:6px 10px;border-bottom:1px solid #d0d7de44;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.sym-link{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}
.sym-link:hover{text-decoration:underline}
.pos{color:var(--green)}.neg{color:var(--red)}

/* ── PERF TABLE ──────────────────────────────────── */
.perf-table{font-size:13px;width:100%;border-collapse:collapse}
.perf-table th{padding:7px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:2px solid var(--border);white-space:nowrap;background:var(--bg2)}
.perf-table th.yr-th{text-align:right}
.perf-table td{padding:9px 14px;border-bottom:1px solid #d0d7de33;white-space:nowrap;vertical-align:middle}
.perf-table tbody tr{cursor:default}
.perf-table tbody tr:hover td{background:var(--bg3)}
.perf-table .tally-row td{background:var(--bg2);border-top:2px solid var(--border);border-bottom:none;font-weight:600}
.perf-table .tally-row:hover td{background:var(--bg2)}
.perf-table .pt-name{font-weight:600;font-size:13px}
.perf-table .mono{font-family:monospace;font-weight:600}
.perf-table .yr-cell{font-family:monospace;font-weight:600;text-align:right}
.perf-table .yr-cell.pos{color:var(--green)}.perf-table .yr-cell.neg{color:var(--red)}.perf-table .yr-cell.neu{color:var(--text3)}
.perf-table .live-row td{background:rgba(26,127,55,.06)}
.perf-table .live-row:hover td{background:rgba(26,127,55,.12) !important}
.perf-table .live-row .pt-name::after{content:'LIVE';font-size:9px;font-weight:700;letter-spacing:.5px;color:var(--green);border:1px solid var(--green);border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:middle}
.perf-table .dim-row td{opacity:.4}

/* ── OVERVIEW STORY ─────────────────────────────── */
.ov-story{max-width:1200px;margin:0 auto;width:100%;padding:18px 20px 0;display:flex;flex-direction:column;gap:12px}
.story-card .card-body{padding:14px}
.story-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.story-copy{display:flex;flex-direction:column;gap:4px;max-width:640px}
.story-title{font-size:18px;font-weight:700;letter-spacing:-.02em}
.story-sub{font-size:12px;color:var(--text2);line-height:1.55}
.story-metrics{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;flex:1;min-width:320px}
.story-metric{border:1px solid var(--border);border-radius:10px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);padding:10px 12px}
.story-metric .lbl{font-size:10px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.story-metric .val{font-size:18px;font-weight:700;font-family:monospace}
.story-metric .sub{font-size:11px;color:var(--text3);margin-top:2px}
.story-chart-shell{border:1px solid var(--border);border-radius:10px;background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);overflow:hidden}
.story-chart{width:100%;display:block}
.story-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.story-note{font-size:11px;color:var(--text3)}
.regime-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.regime-key{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.regime-key .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--border)}
.strip-card .card-body{padding:12px 14px 14px}
.regime-strip-wrap{display:flex;flex-direction:column;gap:8px}
.regime-strip-svg{width:100%;display:block}
.regime-strip-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.regime-strip-note{font-size:11px;color:var(--text3)}
.regime-current{font-size:11px;color:var(--text2)}
.regime-current strong{text-transform:uppercase}

/* ── CHART PAGE ───────────────────────────────────── */
#chart-page{display:flex;flex-direction:column;height:calc(100dvh - 48px);overflow:hidden}
#chart-stats{padding:6px 14px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;gap:14px;flex-wrap:wrap;flex-shrink:0}
.cstat{font-size:12px;display:flex;align-items:center;gap:5px}
.cstat .cl{color:var(--text3)}
#chart-legend{display:flex;gap:10px;padding:4px 12px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.leg-line{width:14px;height:2px;border-radius:1px;flex-shrink:0}
#chart-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#lw-main{flex:1;min-height:0}
#lw-volume{height:104px;flex-shrink:0;border-top:1px solid var(--border)}
#lw-rsi{height:72px;flex-shrink:0;border-top:1px solid var(--border)}
#trade-tbl{flex-shrink:0;height:200px;overflow-y:auto;border-top:2px solid var(--border)}

/* ── LEARNING ────────────────────────────────── */
#page.learning-mode{overflow:hidden;display:flex;flex-direction:column}
.learn-home{max-width:1200px;margin:0 auto;width:100%;padding:22px 20px 36px}
.learn-intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.learn-intro h2{font-size:22px;font-weight:700}
.learn-intro p{font-size:13px;color:var(--text2);max-width:720px}
.learn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.learn-card{border:1px solid var(--border);border-radius:12px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);box-shadow:0 8px 20px rgba(15,23,42,.05);padding:16px;display:flex;flex-direction:column;gap:12px}
.learn-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.learn-card h3{font-size:16px;font-weight:700}
.learn-chip{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
.learn-chip.uptrend{background:var(--up-bg);border-color:var(--up-bdr);color:var(--up-fg)}
.learn-chip.choppy{background:var(--ch-bg);border-color:var(--ch-bdr);color:var(--ch-fg)}
.learn-chip.downtrend{background:var(--dn-bg);border-color:var(--dn-bdr);color:var(--dn-fg)}
.learn-copy{font-size:12px;color:var(--text2);min-height:54px}
.learn-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--text3)}
.learn-meta strong{color:var(--text)}
.learn-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:filter .12s, transform .12s}
.learn-btn:hover{filter:brightness(.96)}
.learn-btn.alt{background:var(--bg);color:var(--accent)}
.learn-btn.alt:hover{background:#eff6ff}
.learn-player{display:flex;flex-direction:column;height:calc(100dvh - 48px)}
.learn-layout{flex:1;min-height:0;display:flex;flex-direction:column}
.learn-chart-shell{display:flex;flex:1;flex-direction:column;min-height:0;background:var(--bg);max-width:1120px;width:100%;margin:0 auto}
.learn-chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.learn-step-copy{padding:12px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%)}
.learn-step-copy .kicker{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.learn-step-copy .title{font-size:16px;font-weight:700;margin-bottom:4px}
.learn-step-copy .text{font-size:12px;line-height:1.55;color:var(--text2);max-width:760px}
.learn-chart-stage{flex:1;min-height:0;display:flex;flex-direction:column}
#learn-chart{flex:1;min-height:420px}
#learn-chart-volume{height:120px;flex-shrink:0;border-top:1px solid var(--border);display:none}
#learn-chart-rsi{height:108px;flex-shrink:0;border-top:1px solid var(--border);display:none}
#learn-chart-legend{display:flex;gap:10px;padding:6px 12px;border-top:1px solid var(--border);background:var(--bg2);flex-wrap:wrap}
.learn-playbar{padding:10px 12px 16px;border-top:1px solid var(--border);background:var(--bg)}
.learn-playbar-inner{width:min(820px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.learn-play-controls,.learn-play-steps{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.learn-step-pills{display:flex;gap:6px;flex-wrap:wrap}
.learn-step-pill{border:1px solid var(--border);background:var(--bg);color:var(--text2);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}
.learn-step-pill.active{border-color:var(--accent);background:#eff6ff;color:var(--accent)}

  .learn-chart-shell{max-width:none}
  .learn-step-copy .text{max-width:none}
  .learn-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

  .learn-grid{grid-template-columns:1fr}
  .ov-story{padding-top:14px}
  .story-title{font-size:16px}

/* ── LIVE PAGE ─────────────────────────────────────── */
.live-hdr{border-bottom:1px solid var(--border);background:var(--bg2);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.live-hdr-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-body{padding:16px 20px 32px;max-width:1200px;margin:0 auto;width:100%}
.sig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.sig-card{display:block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:box-shadow .12s,border-color .12s;border-left:3px solid var(--accent);color:inherit;text-decoration:none}
.sig-card:hover{box-shadow:0 2px 8px rgba(9,105,218,.15);border-color:var(--accent)}

.sig-card .sig-strat{font-size:11px;color:var(--text2);margin-bottom:8px}

.port-body{padding:16px 20px 32px;max-width:1200px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.port-stats{display:flex;gap:12px;flex-wrap:wrap}
.port-stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 18px;flex:1;min-width:140px}
.port-stat .ps-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px}
.port-stat .ps-val{font-size:22px;font-weight:700;font-family:monospace}
.port-stat .ps-sub{font-size:10px;color:var(--text3);margin-top:2px}
.term-wrap{max-width:1200px;margin:0 auto;padding:20px;width:100%}

.term-shell{background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);color:var(--text);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 8px 24px rgba(31,35,40,.08)}
.term-bar{padding:10px 14px;border-bottom:1px solid var(--border);font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text2);background:var(--bg2)}
.term-lines{padding:10px 14px;display:grid;gap:4px;min-height:280px}

.term-line .mk{color:var(--accent)}
.term-line .ok{color:var(--green)}
.term-line .fail{color:var(--red)}
.term-line .run{color:#8250df}

  #nav-inner{padding:0 14px;align-items:flex-start;flex-direction:column;justify-content:center}

  #subnav-inner{padding:10px 14px}
}
</style>
</head>
<body>

<a class="skip-link" href="#page">Skip to Content</a>
<nav id="nav">
  <div id="nav-inner">
    <div id="nav-logo" translate="no"><span class="alpha-sym" aria-hidden="true">α</span>ALPHA ENGINE</div>
    <div id="nav-tabs">
      <a class="nav-tab" href="#/overview" id="tab-overview">Overview</a>
      <a class="nav-tab" href="#/learning" id="tab-learning">Learning</a>
      <a class="nav-tab" href="#/live" id="tab-live">Live</a>
      <a class="nav-tab" href="#/portfolio" id="tab-portfolio">Portfolio</a>
      <a class="nav-tab" href="#/terminal" id="tab-terminal">Terminal</a>
    </div>
  </div>
</nav>
<div id="subnav">
  <div id="subnav-inner">
    <div id="market-switch" class="market-switch" aria-label="Market Switcher"></div>
    <div class="subnav-meta">
      <span class="meta-chip"><span class="meta-label">Market</span><span id="nav-mkt" style="font-weight:600;color:var(--text2)">—</span></span>
      <span id="nav-regime" class="regime-badge">—</span>
      <span class="meta-chip"><span class="meta-label">Updated</span><span id="nav-date">—</span></span>
    </div>
  </div>
</div>

<main id="page" tabindex="-1"><div style="padding:40px;text-align:center;color:var(--text3)">Loading…</div></main>

<script>
const DATA_URL = './chart_data.json';
const LEARNING_DATA_URL = './learning_data.json';
const API_BASE = window.ALPHA_API_BASE || (location.protocol === 'file:' ? '' : location.origin);
const CHART_LIB_URL = 'https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js';
const MARKET_STORAGE_KEY = 'alpha-engine-active-market';
let D = null, ACTIVE_MARKET = null, _charts = [], _symbolOhlcvCache = {}, _learningTimer = null, _learningAutoTimer = null, _learningState = null, _learningLessonCatalog = null;

function normalizePayload(raw) {
  if (raw && typeof raw === 'object' && raw.markets && typeof raw.markets === 'object') {
    return raw;
  }
  if (raw && typeof raw === 'object' && raw.market) {
    const key = String(raw.market).toUpperCase();
    return { ...raw, version: 2, default_market: key, markets: {[key]: raw} };
  }
  return {version: 2, default_market: null, markets: {}};
}

function marketKeys() {
  return Object.keys((D && D.markets) || {}).sort();
}

function normalizeMarketKey(key) {
  return key ? String(key).trim().toUpperCase() : null;
}

function parseHashState() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [pathPart, queryPart = ''] = raw.split('?');
  const path = pathPart || 'overview';
  return {
    path,
    parts: path.split('/').filter(Boolean),
    params: new URLSearchParams(queryPart),
  };
}

function buildHash(path, params) {
  const cleanPath = (path || 'overview').replace(/^\/+/, '');
  const search = params instanceof URLSearchParams
    ? new URLSearchParams(params.toString())
    : new URLSearchParams(params || {});
  const qs = search.toString();
  return '#/' + cleanPath + (qs ? '?' + qs : '');
}

function hashHref(path, marketKey) {
  const params = new URLSearchParams();
  const targetMarket = normalizeMarketKey(marketKey || ACTIVE_MARKET || activeMarketKey());
  if (targetMarket) params.set('market', targetMarket);
  return buildHash(path, params);
}

function activeMarketKey() {
  const keys = marketKeys();
  if (!keys.length) return null;
  if (ACTIVE_MARKET && D.markets && D.markets[ACTIVE_MARKET]) return ACTIVE_MARKET;
  if (D.default_market && D.markets && D.markets[D.default_market]) return D.default_market;
  return keys[0];
}

function currentData() {
  const key = activeMarketKey();
  return key && D && D.markets ? D.markets[key] : null;
}

async function loadOhlcvForSymbol(symbol) {
  const marketKey = activeMarketKey();
  const cacheKey = marketKey + ':' + symbol;
  if (_symbolOhlcvCache[cacheKey]) return _symbolOhlcvCache[cacheKey];

  const query = '?market=' + encodeURIComponent(marketKey || '') + '&symbol=' + encodeURIComponent(symbol) + '&period=5y';
  const apiUrls = apiBaseCandidates().map(base => apiUrl('/api/ohlcv' + query, base));

  let lastErr = null;
  for (const url of apiUrls) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const payload = await r.json();
      const bars = (payload.ohlcv || []).filter(b => b.open != null && b.close != null);
      if (!bars.length) throw new Error('No OHLCV rows for ' + symbol);
      _symbolOhlcvCache[cacheKey] = bars;
      return bars;
    } catch (err) {
      lastErr = err;
    }
  }

  const url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(symbol) + '?range=5y&interval=1d';
  let bars = [];
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('Yahoo Finance fetch failed (' + r.status + ') for ' + symbol);
    const json = await r.json();
    const result = json && json.chart && json.chart.result && json.chart.result[0];
    if (!result) throw new Error('No data from Yahoo Finance for ' + symbol);
    const timestamps = result.timestamp || [];
    const q = (result.indicators && result.indicators.quote && result.indicators.quote[0]) || {};
    bars = timestamps.map((ts, i) => ({
      time:   new Date(ts * 1000).toISOString().slice(0, 10),
      open:   q.open[i]   != null ? Math.round(q.open[i]   * 100) / 100 : null,
      high:   q.high[i]   != null ? Math.round(q.high[i]   * 100) / 100 : null,
      low:    q.low[i]    != null ? Math.round(q.low[i]    * 100) / 100 : null,
      close:  q.close[i]  != null ? Math.round(q.close[i]  * 100) / 100 : null,
      volume: q.volume[i] || 0,
    })).filter(b => b.open != null && b.close != null);
  } catch (err) {
    throw lastErr || err;
  }

  _symbolOhlcvCache[cacheKey] = bars;
  return bars;
}

async function ensureChartLibrary() {
  if (window.LightweightCharts) return window.LightweightCharts;
  if (window.__alphaChartLibPromise) return window.__alphaChartLibPromise;

  window.__alphaChartLibPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = CHART_LIB_URL;
    script.onload = () => resolve(window.LightweightCharts);
    script.onerror = () => reject(new Error('Could not load chart library from unpkg'));
    document.head.appendChild(script);
  });

  return window.__alphaChartLibPromise;
}

function renderMarketSwitch() {
  const box = document.getElementById('market-switch');
  const keys = marketKeys();
  if (keys.length < 2) {
    box.innerHTML = '';
    return;
  }
  const active = activeMarketKey();
  box.innerHTML = keys.map(key =>
    '<button class="market-pill ' + (key === active ? 'active' : '') + '" type="button" aria-pressed="' + (key === active ? 'true' : 'false') + '" onclick="setActiveMarket(\'' + key + '\')">' + key + '</button>'
  ).join('');
}

function updateNavLinks() {
  document.getElementById('tab-overview').href = hashHref('overview');
  document.getElementById('tab-learning').href = hashHref('learning');
  document.getElementById('tab-live').href = hashHref('live');
  document.getElementById('tab-portfolio').href = hashHref('portfolio');
  document.getElementById('tab-terminal').href = hashHref('terminal');
}

function fmtNavDate(value) {
  if (!value) return '—';
  if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return fmtShortDate(value);
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) return value;
  return new Intl.DateTimeFormat(undefined, {
    day: '2-digit',
    month: 'short',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
  }).format(parsed);
}

function updateNavMeta() {
  const data = currentData();
  const reg = ((data && data.current_regime) || '').toLowerCase();
  const badge = document.getElementById('nav-regime');
  badge.textContent = (data && data.current_regime) || '-';
  badge.className = 'regime-badge ' + reg;
  document.getElementById('nav-mkt').textContent = activeMarketKey() || '-';
  document.getElementById('nav-date').textContent = fmtNavDate(data && data.generated);
  renderMarketSwitch();
  updateNavLinks();
}

function setActiveMarket(marketKey) {
  if (!D || !D.markets || !D.markets[marketKey]) return;
  ACTIVE_MARKET = marketKey;
  try { localStorage.setItem(MARKET_STORAGE_KEY, marketKey); } catch (_) {}
  const state = parseHashState();
  const params = new URLSearchParams(state.params.toString());
  params.set('market', marketKey);
  updateNavMeta();
  const target = buildHash(state.path || 'overview', params);
  if (location.hash !== target) {
    location.hash = target;
    return;
  }
  route();
}

async function loadData() {
  D = normalizePayload(await loadSnapshotPayload());
  await hydrateRegimePeriods();
  await loadFixedLearningData();
  const state = parseHashState();
  const routeMarket = normalizeMarketKey(state.params.get('market'));
  const storedMarket = (() => {
    try { return normalizeMarketKey(localStorage.getItem(MARKET_STORAGE_KEY)); } catch (_) { return null; }
  })();
  ACTIVE_MARKET =
    routeMarket && D.markets && D.markets[routeMarket] ? routeMarket :
    storedMarket && D.markets && D.markets[storedMarket] ? storedMarket :
    activeMarketKey();
  updateNavMeta();
  const params = new URLSearchParams(state.params.toString());
  if (ACTIVE_MARKET) params.set('market', ACTIVE_MARKET);
  const target = buildHash(state.path || 'overview', params);
  if (location.hash !== target) {
    location.hash = target;
    return;
  }
  route();
}

async function loadSnapshotPayload() {
  const sources = [DATA_URL];
  const apiSnapshotUrl = apiUrl('/api/snapshot');
  if (!sources.includes(apiSnapshotUrl)) sources.push(apiSnapshotUrl);
  ['http://127.0.0.1:8010/api/snapshot', 'http://localhost:8010/api/snapshot'].forEach(url => {
    if (!sources.includes(url)) sources.push(url);
  });
  let lastErr = null;
  for (const url of sources) {
    try {
      const r = await fetch(url, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error('Snapshot fetch failed');
}

function apiBaseCandidates() {
  const bases = [];
  const configured = API_BASE ? API_BASE.replace(/\/$/, '') : '';
  if (configured) bases.push(configured);
  ['http://127.0.0.1:8010', 'http://localhost:8010', 'http://127.0.0.1:8012', 'http://localhost:8012'].forEach(base => {
    if (!bases.includes(base)) bases.push(base);
  });
  return bases;
}

function apiUrl(path, base) {
  const cleanBase = (base || API_BASE || '').replace(/\/$/, '');
  return cleanBase + path;
}

async function fetchApiJson(path) {
  let lastErr = null;
  for (const base of apiBaseCandidates()) {
    try {
      const r = await fetch(apiUrl(path, base), {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error('API unavailable');
}

async function hydrateRegimePeriods() {
  if (!D || !D.markets) return;
  const keys = Object.keys(D.markets);
  await Promise.all(keys.map(async key => {
    const market = D.markets[key];
    if (Array.isArray(market.regime_periods) && market.regime_periods.length) return;
    try {
      const payload = await fetchApiJson('/api/regime-periods?market=' + encodeURIComponent(key));
      if (Array.isArray(payload && payload.regime_periods) && payload.regime_periods.length) {
        market.regime_periods = payload.regime_periods;
      }
    } catch (_) {}
  }));
}

async function loadFixedLearningData() {
  try {
    const r = await fetch(LEARNING_DATA_URL, {cache:'no-store'});
    if (!r.ok) return;
    const raw = await r.json();
    const lessons = normalizeFixedLearningLessons(raw);
    if (lessons.length) _learningLessonCatalog = lessons;
  } catch (_) {}
}

function normalizeFixedLearningLessons(raw) {
  const lessons = raw && Array.isArray(raw.lessons) ? raw.lessons : [];
  return lessons.map(lesson => {
    const panels = learningPanelsForStrategy(lesson.id);
    const indicatorParams = lesson.indicator_params || {};
    const params = lesson.params || {};
    return {
      ...lesson,
      regime: lesson.regime || 'uptrend',
      copy: learningCopyForStrategy(lesson.id),
      strategy: {
        params,
        indicator_params: indicatorParams,
      },
      indicators: learningIndicatorSpecs(lesson.id, {indicator_params: indicatorParams}),
      showVolumePanel: lesson.showVolumePanel == null ? panels.showVolume : lesson.showVolumePanel,
      showRsiPanel: lesson.showRsiPanel == null ? panels.showRsi : lesson.showRsiPanel,
    };
  }).filter(lesson =>
    lesson.id && lesson.regime && Array.isArray(lesson.bars) &&
    lesson.bars.length && Number.isFinite(lesson.entryIdx) && Number.isFinite(lesson.exitIdx) &&
    lesson.position
  );
}

function route() {
  if (!D) return;
  const state = parseHashState();
  const routeMarket = normalizeMarketKey(state.params.get('market'));
  if (routeMarket && D.markets && D.markets[routeMarket] && routeMarket !== ACTIVE_MARKET) {
    ACTIVE_MARKET = routeMarket;
    try { localStorage.setItem(MARKET_STORAGE_KEY, routeMarket); } catch (_) {}
  }
  updateNavMeta();
  destroyCharts();
  const data = currentData();
  const pg = document.getElementById('page');
  if (!data) {
    pg.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">No market snapshots exported yet. Run chart-export first.</div>';
    return;
  }
  const parts = state.parts;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  pg.classList.remove('chart-mode');
  pg.classList.remove('learning-mode');
  if (!parts.length || parts[0] === 'overview') {
    document.getElementById('tab-overview').classList.add('active');
    renderOverview();
  }
  else if (parts[0] === 'learning' && parts[1] && parts[2]) {
    document.getElementById('tab-learning').classList.add('active');
    pg.classList.add('learning-mode');
    renderLearningLesson(parts[1], parts[2]);
  }
  else if (parts[0] === 'learning') {
    document.getElementById('tab-learning').classList.add('active');
    renderLearningHome();
  }
  else if (parts[0] === 'live') {
    document.getElementById('tab-live').classList.add('active');
    renderLivePage();
  }
  else if (parts[0] === 'portfolio') {
    document.getElementById('tab-portfolio').classList.add('active');
    renderPortfolioPage();
  }
  else if (parts[0] === 'terminal') {
    document.getElementById('tab-terminal').classList.add('active');
    renderTerminalPage();
  }
  else if (parts[0] === 'strategy' && parts[1] && parts[2]) renderStrategyDetail(parts[1], parts[2]);
  else if (parts[0] === 'chart' && parts[1] && parts[2] && parts[3]) { pg.classList.add('chart-mode'); renderSymbolChart(parts[1], parts[2], decodeURIComponent(parts[3])); }
  else if (parts[0] === 'chart' && parts[1] && parts[2]) { pg.classList.add('chart-mode'); renderSymbolChart(parts[1], null, decodeURIComponent(parts[2])); }
  else {
    document.getElementById('tab-overview').classList.add('active');
    renderOverview();
  }
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () =>
  loadData().catch(e => {
    document.getElementById('page').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--red)">Error loading data: ' + e.message + '</div>';
  })
);

function destroyCharts() {
  clearLearningTimers();
  _charts.forEach(c => { try { c.remove(); } catch(_) {} });
  _charts = [];
}

function clearLearningTimers() {
  if (_learningTimer) {
    clearTimeout(_learningTimer);
    _learningTimer = null;
  }
  if (_learningAutoTimer) {
    clearTimeout(_learningAutoTimer);
    _learningAutoTimer = null;
  }
}

/* ── UTILS ──────────────────────────────────────── */
const fmt = (n, d=0) => n == null ? '—' : n.toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
const avgRetFromYearly = yearly => {
  const vals = Object.values(yearly||{}).map(y => y.ret_pct||0);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
};
const pct = (n, d=1) => n == null ? '—' : (n >= 0 ? '+' : '') + n.toFixed(d) + '%';
const clr = n => n >= 0 ? 'pos' : 'neg';
const nav = path => {
  const state = parseHashState();
  const params = new URLSearchParams(state.params.toString());
  const marketKey = normalizeMarketKey(ACTIVE_MARKET || activeMarketKey());
  if (marketKey) params.set('market', marketKey);
  const target = buildHash(path || 'overview', params);
  if (location.hash !== target) {
    location.hash = target;
    return;
  }
  route();
};
const DISABLED_STRATEGY_IDS = new Set(['narrow_range']);
const isVisibleStrategy = strat => !!strat && !DISABLED_STRATEGY_IDS.has(strat.id);
const pill = r => {
  const cls = r === 'uptrend' ? 'uptrend' : r === 'choppy' ? 'choppy' : 'downtrend';
  const lbl = r === 'uptrend' ? '▲ UPTREND' : r === 'choppy' ? '≈ CHOPPY' : '▼ DOWNTREND';
  return '<span class="pill ' + cls + '">' + lbl + '</span>';
};
const sLabel = id => id ? id.replace(/_/g, ' ') : '—';

const money = n => n == null ? '—' : '$' + fmt(n, 0);

function isoDate(ymd) {
  return new Date(ymd + 'T00:00:00Z');
}

function fmtShortDate(ymd) {
  const d = isoDate(ymd);
  return d.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric', timeZone:'UTC'});
}

function todayYmd() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function dayDiff(start, end) {
  return Math.round((isoDate(end) - isoDate(start)) / 86400000);
}

function addDays(ymd, days) {
  const d = isoDate(ymd);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function collectPassingEntries(rm, optLookup, allIds) {
  const REGIMES = ['uptrend','choppy','downtrend'];
  const regimeRank = Object.fromEntries(REGIMES.map((reg, idx) => [reg, idx]));
  const passEntries = [];
  allIds.forEach(id => {
    REGIMES.forEach(reg => {
      const base = rm[id + '|' + reg];
      if (base && base.pass) passEntries.push({id, reg, base, opt: optLookup[id + '|' + reg] || null});
    });
  });
  passEntries.sort((a, b) => {
    const ar = regimeRank[a.reg] ?? 99;
    const br = regimeRank[b.reg] ?? 99;
    if (ar !== br) return ar - br;
    const ac = a.opt ? a.opt.calmar : a.base.calmar;
    const bc = b.opt ? b.opt.calmar : b.base.calmar;
    if ((bc || 0) !== (ac || 0)) return (bc || 0) - (ac || 0);
    return sLabel(a.id).localeCompare(sLabel(b.id));
  });
  return passEntries;
}

function buildYearMarks(points, xAt) {
  const marks = [];
  const seenYears = new Set();
  points.forEach((point, idx) => {
    const year = point.date.slice(0, 4);
    if ((idx === 0 || point.date.slice(5) === '01-01') && !seenYears.has(year)) {
      seenYears.add(year);
      marks.push({year, date: point.date, x: xAt(point.date)});
    }
  });
  return marks;
}

function buildOverviewPortfolioModel(data, passEntries) {
  const periods = Array.isArray(data && data.regime_periods)
    ? data.regime_periods.filter(p => p && p.start_date && p.end_date && p.regime)
    : [];
  const tradeEntries = passEntries.filter(entry => entry.opt && Array.isArray(entry.opt.symbols));
  if (!periods.length || !tradeEntries.length) return null;

  const strategyCount = tradeEntries.length;
  const pnlByDate = {};
  tradeEntries.forEach(entry => {
    (entry.opt.symbols || []).forEach(sym => {
      (sym.trades || []).forEach(trade => {
        const key = trade.exit_date || trade.entry_date;
        pnlByDate[key] = (pnlByDate[key] || 0) + ((+trade.pnl || 0) / strategyCount);
      });
    });
  });

  const start = periods[0].start_date;
  const end = periods[periods.length - 1].end_date;
  const totalDays = Math.max(1, dayDiff(start, end));
  const points = [];
  let cursor = start;
  let equity = CAPITAL;
  let peak = CAPITAL;
  let maxDrawdown = 0;

  while (cursor <= end) {
    equity += pnlByDate[cursor] || 0;
    peak = Math.max(peak, equity);
    const drawdownPct = peak > 0 ? ((equity / peak) - 1) * 100 : 0;
    maxDrawdown = Math.min(maxDrawdown, drawdownPct);
    points.push({date: cursor, equity, drawdownPct});
    cursor = addDays(cursor, 1);
  }

  const finalEquity = points.length ? points[points.length - 1].equity : CAPITAL;
  const totalReturnPct = ((finalEquity / CAPITAL) - 1) * 100;
  const years = (totalDays + 1) / 365.25;
  const cagrPct = years > 0 ? ((Math.pow(finalEquity / CAPITAL, 1 / years) - 1) * 100) : 0;

  return {
    start,
    end,
    periods,
    points,
    strategyCount,
    finalEquity,
    totalReturnPct,
    cagrPct,
    maxDrawdownPct: maxDrawdown,
  };
}

function buildOverviewSummarySection(data, passEntries, cur) {
  const model = buildOverviewPortfolioModel(data, passEntries);
  if (!model) return '';

  const W = 1100;
  const H = 250;
  const M = {top: 16, right: 18, bottom: 28, left: 60};
  const innerW = W - M.left - M.right;
  const innerH = H - M.top - M.bottom;
  const minEq = Math.min(...model.points.map(p => p.equity));
  const maxEq = Math.max(...model.points.map(p => p.equity));
  const span = Math.max(1, maxEq - minEq);
  const yMin = minEq - span * 0.08;
  const yMax = maxEq + span * 0.08;
  const totalDays = Math.max(1, dayDiff(model.start, model.end));
  const xAt = ymd => M.left + (dayDiff(model.start, ymd) / totalDays) * innerW;
  const yAt = eq => M.top + ((yMax - eq) / Math.max(1, yMax - yMin)) * innerH;

  const bandFill = {
    uptrend: 'rgba(26,127,55,0.10)',
    choppy: 'rgba(154,103,0,0.11)',
    downtrend: 'rgba(207,34,46,0.10)',
  };
  const bandStroke = {
    uptrend: 'rgba(26,127,55,0.12)',
    choppy: 'rgba(154,103,0,0.13)',
    downtrend: 'rgba(207,34,46,0.12)',
  };

  const bandRects = model.periods.map(period => {
    const x1 = xAt(period.start_date);
    const x2 = xAt(period.end_date) + (innerW / totalDays);
    return '<rect x="' + x1.toFixed(2) + '" y="' + M.top + '" width="' + Math.max(1, x2 - x1).toFixed(2) + '" height="' + innerH + '" fill="' + bandFill[period.regime] + '" stroke="' + bandStroke[period.regime] + '" stroke-width="0.5"></rect>';

  const yTicks = [yMin, (yMin + yMax) / 2, yMax];
  const yGrid = yTicks.map(value => {
    const y = yAt(value);

  }).join('');

  const lastPoint = model.points[model.points.length - 1];
  const lastX = xAt(lastPoint.date);
  const lastY = yAt(lastPoint.equity);
  const regimeCounts = model.periods.reduce((acc, period) => {
    acc[period.regime] = (acc[period.regime] || 0) + 1;
    return acc;
  }, {});

  const stripW = W;
  const stripH = 54;
  const stripX = xAt;

    const x1 = stripX(period.start_date);

      (highlight ? '<rect x="' + x1.toFixed(2) + '" y="5" width="' + Math.max(2, x2 - x1).toFixed(2) + '" height="24" rx="8" fill="none" stroke="rgba(9,105,218,0.45)" stroke-width="2"></rect>' : '') +

  const stripYears = yearMarks.map(mark =>
    '<text x="' + stripX(mark.date).toFixed(2) + '" y="46" font-size="11" fill="#656d76" text-anchor="middle">' + mark.year + '</text>'

  return (

            '</div>' +
          '</div>' +
          '<div class="story-chart-shell">' +
            '<svg class="story-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-label="5-year realised equity curve">' +
              '<defs>' +
                '<linearGradient id="equityFill" x1="0" y1="0" x2="0" y2="1">' +
                  '<stop offset="0%" stop-color="rgba(9,105,218,0.24)"></stop>' +
                  '<stop offset="100%" stop-color="rgba(9,105,218,0.02)"></stop>' +
                '</linearGradient>' +

              bandRects +
              yGrid +
              yearGrid +

              '<circle cx="' + lastX.toFixed(2) + '" cy="' + lastY.toFixed(2) + '" r="4.5" fill="#0969da" stroke="#fff" stroke-width="2"></circle>' +
              '<text x="' + Math.min(W - 18, lastX + 10).toFixed(2) + '" y="' + Math.max(18, lastY - 10).toFixed(2) + '" font-size="11" fill="#1f2328">' + money(lastPoint.equity) + '</text>' +
            '</svg>' +
          '</div>' +
          '<div class="story-foot">' +

              stripRects +

/* ── OVERVIEW ────────────────────────────────────── */
function renderOverview() {
  const data   = currentData();
  const rm     = (data && data.regime_map) || {};
  const strats = ((data && data.strategies) || []).filter(isVisibleStrategy);
  const cur    = ((data && data.current_regime) || '').toLowerCase();
  const allIds = [...new Set(Object.keys(rm).map(k => k.split('|')[0]).filter(id => !DISABLED_STRATEGY_IDS.has(id)))].sort();
  const optLookup = {};
  strats.forEach(s => { optLookup[s.id + '|' + s.regime] = s; });
  const passEntries = collectPassingEntries(rm, optLookup, allIds);

  if (!allIds.length) { renderOverviewFallback(strats, cur); return; }

  const REGIMES = [
    {key:'uptrend',   label:'▲ Uptrend'},
    {key:'choppy',    label:'≈ Choppy'},
    {key:'downtrend', label:'▼ Downtrend'},
  ];

  let cols = '';
  REGIMES.forEach(({key, label}) => {
    const isActive = cur === key;
    // Build entries sorted: PASS first by ret_pct desc, then FAIL by calmar desc
    const entries = allIds.map(id => {
      const base = rm[id + '|' + key];
      return base ? {id, base, opt: optLookup[id + '|' + key], pass: base.pass} : null;
    }).filter(Boolean).sort((a, b) => {
      if (a.pass !== b.pass) return b.pass - a.pass;
      const ar = a.opt ? a.opt.ret_pct : a.base.calmar * 10;
      const br = b.opt ? b.opt.ret_pct : b.base.calmar * 10;
      return br - ar;
    });
    const passCount = entries.filter(e => e.pass).length;

    let cards = '';
    entries.forEach(({id, base, opt, pass}) => {
      const calmar  = opt ? opt.calmar  : base.calmar;
      const wr      = opt ? opt.win_rate : base.wr;
      const ntrades = opt ? opt.symbols.reduce((a,s) => a + s.trade_count, 0) : base.trade_count;
      const href    = pass && opt ? hashHref('strategy/' + id + '/' + key) : '';
      cards +=
        '<' + (href ? 'a href="' + href + '"' : 'div') + ' class="strat-card ' + (pass ? 'pass ' + (opt ? 'clickable' : '') : 'fail') + '">' +
          '<div class="sc-name">' + sLabel(id) + ' <span class="badge ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'FAIL') + '</span></div>' +
          '<div class="sc-metrics">' +
            '<div class="sc-m"><div class="sc-ml">Calmar</div><div class="sc-mv neu">' + fmt(calmar, 2) + '</div></div>' +
            '<div class="sc-m"><div class="sc-ml">Win Rate</div><div class="sc-mv neu">' + fmt(wr, 1) + '%</div></div>' +
            '<div class="sc-m"><div class="sc-ml">Trades</div><div class="sc-mv neu">' + ntrades + '</div></div>' +
          '</div>' +
        '</' + (href ? 'a' : 'div') + '>';
    });
    if (!cards) cards = '<div class="no-edge">No strategies in this regime</div>';

    cols +=
      '<div class="regime-col' + (isActive ? ' active-col' : '') + '">' +
        '<div class="rcol-hdr ' + key + '">' +
          '<span class="rcol-title ' + key + '">' + label + '</span>' +
          (isActive ? '<span class="active-mark">ACTIVE</span>' : '') +
          '<span class="rcol-ct">' + passCount + '/' + allIds.length + ' PASS</span>' +
        '</div>' +
        '<div class="rcol-body">' + cards + '</div>' +
      '</div>';
  });

  const summarySection = buildOverviewSummarySection(data, passEntries, cur);
  const tableSection = buildPerfTable(rm, optLookup, allIds, cur, passEntries);

  document.getElementById('page').innerHTML =
    '<div class="ov-bar"><div class="ov-inner"><h2>Regime Overview</h2>' + (cur ? '<span class="sub">Current regime: <strong>' + cur + '</strong></span>' : '') + '</div></div>' +
    summarySection +
    '<div style="padding-top:20px">' + tableSection + '</div>' +
    '<div class="ov-grid">' + cols + '</div>';
}

/* ── PERF TABLE BUILDER ──────────────────────────── */
const CAPITAL = 1_000_000;

function optYearly(opt, years) {
  if (!opt || !opt.symbols) return null;
  const yrPnl = {};
  years.forEach(y => yrPnl[y] = 0);
  opt.symbols.forEach(s => {
    (s.trades || []).forEach(t => {
      const yr = t.entry_date.slice(0, 4);
      if (yr in yrPnl) yrPnl[yr] += t.pnl || 0;
    });
  });
  const result = {};
  years.forEach(y => result[y] = {ret_pct: +(yrPnl[y] / CAPITAL * 100).toFixed(2)});
  return result;
}
function optYearlyStats(opt) {
  if (!opt || !opt.symbols) return null;
  const posMap = {};
  opt.symbols.forEach(s => {
    (s.trades || []).forEach(t => {
      const pid = t.position_id || (t.entry_date + '_' + t.entry_price + '_' + s.symbol);
      const yr  = t.entry_date.slice(0, 4);
      if (!posMap[pid]) posMap[pid] = {year:yr, pnl:0};
      posMap[pid].pnl += t.pnl || 0;
      posMap[pid].year = yr;
    });
  });
  const yearly = {};
  Object.values(posMap).forEach(pos => {
    const yr = pos.year;
    if (!yearly[yr]) yearly[yr] = {ret_pct:0, trade_count:0, win_count:0, wr:null};
    yearly[yr].ret_pct += pos.pnl || 0;
    yearly[yr].trade_count += 1;
    if ((pos.pnl || 0) > 0) yearly[yr].win_count += 1;
  });
  Object.keys(yearly).forEach(yr => {
    const y = yearly[yr];
    y.ret_pct = +(y.ret_pct / CAPITAL * 100).toFixed(2);
    y.wr = y.trade_count ? +(y.win_count / y.trade_count * 100).toFixed(1) : null;
  });
  return yearly;
}

function buildPerfTable(rm, optLookup, allIds, cur, passEntriesOverride) {
  const passEntries = Array.isArray(passEntriesOverride) ? [...passEntriesOverride] : collectPassingEntries(rm, optLookup, allIds);
  if (!passEntries.length) return '';

  const allYears = new Set();
  passEntries.forEach(({base}) => Object.keys(base.yearly||{}).forEach(y => allYears.add(y)));
  const years = [...allYears].sort();

  let tCal=0, tDd=0, tWr=0, n=0;
  const tYr = {};
  const regYrSum = {uptrend:{}, choppy:{}, downtrend:{}};
  const regYrCnt = {uptrend:{}, choppy:{}, downtrend:{}};
  years.forEach(y => {
    tYr[y] = 0;
    ['uptrend','choppy','downtrend'].forEach(r => { regYrSum[r][y] = 0; regYrCnt[r][y] = 0; });
  });

  let rows = '';
  passEntries.forEach(({id, reg, base, opt}) => {
    const calmar  = opt ? opt.calmar   : base.calmar;
    const dd      = opt ? opt.max_dd   : base.max_dd;
    const wr      = opt ? opt.win_rate : base.wr;
    const yearly  = (opt ? optYearly(opt, years) : null) || base.yearly || {};
    const isLive  = cur && reg === cur;
    tCal += calmar||0; tDd += dd||0; tWr += wr||0; n++;

    let yrCells = '';
    years.forEach(y => {
      const rp = (yearly[y] || {}).ret_pct;
      if (rp != null) {
        tYr[y] += rp;
        if (regYrSum[reg]) { regYrSum[reg][y] = (regYrSum[reg][y]||0) + rp; regYrCnt[reg][y] = (regYrCnt[reg][y]||0) + 1; }
      }
      const cls = rp == null ? '' : rp >= 0 ? 'pos' : 'neg';
      yrCells += '<td class="yr-cell ' + cls + '">' + (rp != null ? pct(rp) : '—') + '</td>';
    });

    const rowCls = cur ? (isLive ? 'live-row' : 'dim-row') : '';
    rows +=
      '<tr class="' + rowCls + '">' +
        '<td class="pt-name"><a class="sym-link" href="' + hashHref('strategy/' + id + '/' + reg) + '">' + sLabel(id) + '</a></td>' +
        '<td>' + pill(reg) + '</td>' +
        '<td class="mono">' + fmt(calmar,2) + '</td>' +
        '<td class="mono neg">' + (dd!=null ? fmt(dd,1)+'%' : '—') + '</td>' +
        '<td class="mono">' + (wr!=null ? fmt(wr,1)+'%' : '—') + '</td>' +
        yrCells +
      '</tr>';
  });

  const ryw = (currentData() || {}).regime_year_weights || null;
  let tallyYr = '';
  years.forEach(y => {
    let v;
    if (ryw && ryw[y]) {
      v = ['uptrend','choppy','downtrend'].reduce((acc, r) => {
        const w = ryw[y][r] || 0;

    const cls = v >= 0 ? 'pos' : 'neg';
    tallyYr += '<td class="yr-cell ' + cls + '" style="font-weight:700">' + pct(v) + '</td>';

function findBarIndexByDate(bars, targetDate) {
  if (!bars || !bars.length) return -1;
  const exact = bars.findIndex(b => b.time === targetDate);
  if (exact >= 0) return exact;
  const firstAfter = bars.findIndex(b => b.time >= targetDate);
  return firstAfter >= 0 ? firstAfter : bars.length - 1;
}

function extractLearningPositions(symbolRows) {
  const posMap = {};
  (symbolRows || []).forEach(sym => {
    (sym.trades || []).forEach(t => {
      const pid = t.position_id || (t.entry_date + '_' + t.entry_price + '_' + sym.symbol);
      if (!posMap[pid]) {
        posMap[pid] = {
          position_id: pid,
          symbol: sym.symbol,
          entry_date: t.entry_date,
          exit_date: t.exit_date,
          entry_price: t.entry_price,
          stop_price: t.sl_price,
          tp1_price: t.tp1_price,
          tp2_price: t.tp2_price,
          pnl: 0,
          bars_held: 0,
          exits: [],
        };
      }
      const row = posMap[pid];
      row.pnl += +(t.pnl || 0);
      row.exit_date = row.exit_date > t.exit_date ? row.exit_date : t.exit_date;
      row.stop_price = row.stop_price != null ? row.stop_price : t.sl_price;
      row.tp1_price = row.tp1_price != null ? row.tp1_price : t.tp1_price;
      row.tp2_price = row.tp2_price != null ? row.tp2_price : t.tp2_price;
      row.bars_held = Math.max(row.bars_held || 0, t.bars_held || 0);
      row.exits.push({
        exit_date: t.exit_date,
        exit_price: t.exit_price,
        exit_reason: t.exit_reason,
        pnl: t.pnl,
      });
    });
  });
  return Object.values(posMap)
    .map(pos => ({...pos, exits: pos.exits.sort((a,b) => a.exit_date < b.exit_date ? -1 : 1)}))
    .sort((a,b) => {
      const aScore = a.pnl > 0 ? a.pnl + 1e9 : a.pnl;
      const bScore = b.pnl > 0 ? b.pnl + 1e9 : b.pnl;
      return bScore - aScore;
    });
}

function learningPivotBreakoutGuide(state, visibleStartIdx, visibleEndIdx) {
  const p = (state.lesson.strategy && state.lesson.strategy.params) || {};
  const lookback = Math.max(1, parseInt(p.lookback || 10, 10));
  const from = Math.max(0, state.entryIdx - lookback - 1);
  const to = Math.max(from, state.entryIdx - 2);
  const prior = state.bars.slice(from, to + 1);
  if (!prior.length) return null;
  const level = Math.max(...prior.map(bar => bar.close));
  return state.bars.slice(visibleStartIdx, visibleEndIdx + 1).map(bar => ({
    time: bar.time,
    value: level,
  }));
}

function learningPullbackBuyGuide(state, visibleStartIdx, visibleEndIdx) {
  const p = (state.lesson.strategy && state.lesson.strategy.params) || {};
  const lookback = Math.max(1, parseInt(p.lookback || 10, 10));
  const bandMult = Number.isFinite(+p.pullback_atr_band) ? +p.pullback_atr_band : 0.5;
  const from = Math.max(0, state.entryIdx - lookback);
  const to = Math.max(from, state.entryIdx - 1);
  const prior = state.bars.slice(from, to + 1);
  if (!prior.length) return null;

  const pivot = prior.reduce((best, bar, offset) => {
    const idx = from + offset;
    return bar.high > best.price ? {idx, price: bar.high} : best;
  }, {idx: from, price: prior[0].high});
  const atrSeries = calcATR(state.bars, 14);
  const band = (atrSeries[state.entryIdx] || 0) * bandMult;
  const bars = state.bars.slice(visibleStartIdx, visibleEndIdx + 1);
  const line = bars.map(bar => ({time: bar.time, value: pivot.price}));
  const upper = bars.map(bar => ({time: bar.time, value: pivot.price + band}));
  const lower = bars.map(bar => ({time: bar.time, value: pivot.price - band}));
  return {line, upper, lower, pivot};
}

function learningRepresentativeScore(position) {
  const barsHeld = position.bars_held || 0;
  const lastExit = (position.exits || [])[position.exits.length - 1] || {};
  let score = 0;
  score += position.pnl > 0 ? 100 : -40;
  score += position.stop_price != null ? 10 : 0;
  score += position.tp1_price != null ? 10 : 0;
  score += lastExit.exit_reason === 'tp1' || lastExit.exit_reason === 'tp2' || lastExit.exit_reason === 'ema10_exit' ? 18 : 0;
  score -= Math.abs(barsHeld - 14) * 1.25;
  score -= position.entry_price > 0 && position.entry_price < 0.1 ? 20 : 0;
  score -= position.entry_price > 300 ? 10 : 0;
  return score;
}

function chooseRepresentativeLearningPosition(strat) {
  const positions = extractLearningPositions(strat.symbols || []);
  if (!positions.length) return null;
  return [...positions].sort((a, b) => learningRepresentativeScore(b) - learningRepresentativeScore(a))[0] || null;
}

function learningMedian(values) {
  const nums = (values || []).filter(v => Number.isFinite(v) && v > 0).sort((a, b) => a - b);
  if (!nums.length) return null;
  const mid = Math.floor(nums.length / 2);
  return nums.length % 2 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
}

function learningRound(n) {
  return n == null ? null : +n.toFixed(2);
}

function buildAnonymizedLearningWindow(strat, position, ohlcv) {
  const entryIdxFull = findBarIndexByDate(ohlcv, position.entry_date);
  const exitIdxFull = findBarIndexByDate(ohlcv, position.exit_date);
  if (entryIdxFull < 0 || exitIdxFull < 0) return null;

  const viewStart = Math.max(0, entryIdxFull - 40);
  const viewEnd = Math.min(ohlcv.length - 1, Math.max(exitIdxFull + 14, entryIdxFull + 18));
  const historyStart = Math.max(0, viewStart - 220);
  const rawBars = ohlcv.slice(historyStart, viewEnd + 1);
  if (!rawBars.length || !position.entry_price) return null;

  const scale = 100 / position.entry_price;
  const volBase = learningMedian(rawBars.map(b => b.volume || 0)) || 1;
  const anonDates = learningBusinessDates(rawBars.length, '2024-01-02');
  const bars = rawBars.map((bar, idx) => ({
    time: anonDates[idx],
    open: learningRound(bar.open * scale),
    high: learningRound(bar.high * scale),
    low: learningRound(bar.low * scale),
    close: learningRound(bar.close * scale),
    volume: Math.max(0, Math.round(((bar.volume || 0) / volBase) * 100000)),
  }));
  const lastExit = (position.exits || [])[position.exits.length - 1] || {};
  return {
    bars,
    baseIdx: viewStart - historyStart,
    entryIdx: entryIdxFull - historyStart,
    exitIdx: exitIdxFull - historyStart,
    position: {
      entry_price: learningRound(position.entry_price * scale),
      stop_price: learningRound(position.stop_price * scale),
      tp1_price: learningRound(position.tp1_price * scale),
      tp2_price: learningRound(position.tp2_price * scale),
      exit_reason: lastExit.exit_reason || 'exit',
    },
    summary: 'Anonymized real market window',
    outcomeText: 'This lesson uses a real trade window with the prices and volumes rescaled, so the structure stays realistic while the instrument stays anonymous.',
  };
}

function learningLerp(a, b, t) {
  return a + (b - a) * t;
}

function learningRamp(start, end, count, amp=0) {
  return Array.from({length: count}, (_, i) => {
    const t = count <= 1 ? 1 : i / (count - 1);
    return +(learningLerp(start, end, t) + Math.sin(i * 0.9) * amp).toFixed(2);
  });
}

function learningBusinessDates(count, start='2023-01-02') {
  const out = [];
  const d = new Date(start + 'T00:00:00Z');
  while (out.length < count) {
    const day = d.getUTCDay();
    if (day !== 0 && day !== 6) out.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return out;
}

function prependLearningHistory(pattern, regime) {
  const first = pattern[0];
  if (regime === 'uptrend') return learningRamp(first * 0.74, first, 180, first * 0.003);
  if (regime === 'downtrend') return learningRamp(first * 1.28, first, 180, first * 0.004);
  return Array.from({length: 180}, (_, i) => +(first + Math.sin(i / 4) * first * 0.018).toFixed(2));
}

function buildLearningBars(closes, volumes, overrides={}) {
  const dates = learningBusinessDates(closes.length);
  let prevClose = closes[0] * 0.994;
  return closes.map((close, idx) => {
    const open = idx === 0 ? close * 0.996 : prevClose + (close - prevClose) * 0.35;
    const spread = Math.max(Math.abs(close - open) * 0.9, close * 0.012);
    let bar = {
      time: dates[idx],
      open: +open.toFixed(2),
      high: +(Math.max(open, close) + spread).toFixed(2),
      low: +(Math.min(open, close) - spread).toFixed(2),
      close: +close.toFixed(2),
      volume: Math.round(volumes[idx] || 100000),
    };
    if (overrides[idx]) bar = {...bar, ...overrides[idx]};
    prevClose = bar.close;
    return bar;
  });
}

    const history = prependLearningHistory(spec.pattern, spec.regime);
    const closes = history.concat(spec.pattern);
    const volumes = Array(history.length).fill(Math.round((spec.volumes[0] || 100000) * 0.85)).concat(spec.volumes);
    const offset = history.length;
    const overrides = {};
    Object.entries(spec.overridesLocal || {}).forEach(([idx, bar]) => {
      overrides[offset + Number(idx)] = bar;
    });
    const bars = buildLearningBars(closes, volumes, overrides);
    const copy = learningCopyForStrategy(spec.id);
    const panels = learningPanelsForStrategy(spec.id);
    return {
      id: spec.id,
      regime: spec.regime,
      copy,
      focus: spec.focus,
      bars,
      entryIdx: offset + spec.entryIdxLocal,
      exitIdx: offset + spec.exitIdxLocal,
      indicator_params: spec.indicator_params || {},
      indicators: learningIndicatorSpecs(spec.id, {indicator_params: spec.indicator_params || {}}),
      showVolumePanel: panels.showVolume,
      showRsiPanel: panels.showRsi,
      outcomeText: spec.outcomeText,
      position: {
        entry_price: spec.entryPrice,
        stop_price: spec.stopPrice,
        tp1_price: spec.tp1Price,
        tp2_price: spec.tp2Price == null ? null : spec.tp2Price,
        exit_reason: spec.tp2Price != null ? 'tp2' : 'tp1',
      },
    };
  }).sort((a, b) => {
    const aKey = a.copy.title + '|' + a.regime;
    const bKey = b.copy.title + '|' + b.regime;
    return aKey < bKey ? -1 : aKey > bKey ? 1 : 0;
  });
}

/* ── STRATEGY DETAIL ─────────────────────────────── */
function renderStrategyDetail(stratId, regime) {
  if (DISABLED_STRATEGY_IDS.has(stratId)) {
    document.getElementById('page').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">Not found.</div>';
    return;
  }
  const data  = currentData();
  const strat = ((data && data.strategies)||[]).filter(isVisibleStrategy).find(s => s.id===stratId && s.regime===regime);
  const rm    = ((data && data.regime_map)||{})[stratId+'|'+regime] || {};
  if (!strat && !rm.calmar) {
    document.getElementById('page').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">Not found.</div>';
    return;
  }
  const calmar  = strat ? strat.calmar  : rm.calmar;
  const retPct  = strat ? strat.ret_pct : null;
  const wr      = strat ? strat.win_rate : rm.wr;
  const maxdd   = strat ? strat.max_dd  : rm.max_dd;
  const combo   = strat ? strat.combo   : '';
  const syms    = strat ? strat.symbols : [];
  const ip      = strat ? (strat.indicator_params||{}) : {};
  const totalTrades = syms.reduce((a,s) => a + s.trade_count, 0);

  // ── Year bars (base run)
  const yearly = (strat ? optYearlyStats(strat) : null) || rm.yearly || {};
  const yrs    = Object.keys(yearly).sort();
  let maxAbs = 0;
  yrs.forEach(y => { const v = Math.abs((yearly[y]||{}).ret_pct||0); if (v>maxAbs) maxAbs=v; });
  let yrBarsHtml = '';
  if (yrs.length) {
    yrs.forEach(y => {
      const info = yearly[y]||{}, rp = info.ret_pct||0;
      const w = maxAbs > 0 ? Math.abs(rp)/maxAbs*100 : 0;
      const cls = rp >= 0 ? 'pos' : 'neg';
      yrBarsHtml +=
        '<div class="yr-row">' +
          '<div class="yr-lbl">' + y + '</div>' +
          '<div class="yr-wrap"><div class="yr-bar ' + cls + '" style="width:' + w.toFixed(1) + '%"></div></div>' +
          '<div class="yr-val ' + cls + '">' + pct(rp) + '</div>' +
          '<div class="yr-tc">' + (info.trade_count||0) + ' trades</div>' +
        '</div>';
    });
  } else {
    yrBarsHtml = '<div style="color:var(--text3);font-size:11px">No yearly data — re-run chart-export</div>';
  }

  // ── Param explanation
  const paramsHtml = buildParams(stratId, combo, ip, strat ? (strat.params||null) : null);

  // ── Year accordion: group trades by entry year
  // Group trades by position_id so partial exits count as 1 trade
  const yearMap = {};
  syms.forEach(s => {
    // First pass: accumulate PnL per position
    const posPnl = {};
    const posYr  = {};
    (s.trades||[]).forEach(t => {
      const pid = t.position_id || (t.entry_date + '_' + t.entry_price);
      const yr  = t.entry_date.slice(0, 4);
      posPnl[pid] = (posPnl[pid] || 0) + t.pnl;
      posYr[pid]  = yr;
    });
    // Second pass: count positions per year
    Object.entries(posPnl).forEach(([pid, pnl]) => {
      const yr = posYr[pid];
      if (!yearMap[yr]) yearMap[yr] = {};
      if (!yearMap[yr][s.symbol]) yearMap[yr][s.symbol] = {symbol:s.symbol, pnl:0, trades:0, wins:0};
      const d = yearMap[yr][s.symbol];
      d.pnl += pnl; d.trades++; if (pnl > 0) d.wins++;
    });
  });
  const sortedYrs = Object.keys(yearMap).sort().reverse(); // newest first

  let accordHtml = '';
  sortedYrs.forEach((yr, idx) => {
    const symList  = Object.values(yearMap[yr]).sort((a,b) => b.pnl - a.pnl);
    const yrPnl    = symList.reduce((a,s) => a + s.pnl, 0);
    const yrTrades = symList.reduce((a,s) => a + s.trades, 0);
    const isOpen   = idx === 0;
    let rows = '';
    symList.forEach((s, i) => {
      const wrS = s.trades > 0 ? (s.wins/s.trades*100).toFixed(0) + '%' : '—';
      rows +=
        '<tr>' +
          '<td style="color:var(--text3)">' + (i+1) + '</td>' +
          '<td><a class="sym-link" href="' + hashHref('chart/' + stratId + '/' + regime + '/' + encodeURIComponent(s.symbol)) + '">' + s.symbol + '</a></td>' +
          '<td class="' + clr(s.pnl) + '">' + fmt(s.pnl) + '</td>' +
          '<td>' + s.trades + '</td>' +
          '<td>' + wrS + '</td>' +
          '<td><a class="sym-link" href="' + hashHref('chart/' + stratId + '/' + regime + '/' + encodeURIComponent(s.symbol)) + '">→ Chart</a></td>' +
        '</tr>';
    });
    accordHtml +=
      '<div class="yr-accord">' +
        '<button type="button" class="yr-head' + (isOpen?' open':'') + '" onclick="toggleYr(this)">' +
          '<span class="yr-yr">' + yr + '</span>' +
          '<span class="yr-meta">' + yrTrades + ' trades &nbsp;·&nbsp; ' + symList.length + ' symbols</span>' +
          '<span class="yr-pnl ' + clr(yrPnl) + '">' + fmt(yrPnl) + '</span>' +
          '<span class="yr-arr">▼</span>' +
        '</button>' +
        '<div class="yr-body' + (isOpen?' open':'') + '">' +
          '<table><thead><tr><th>#</th><th>Symbol</th><th>PnL</th><th>Trades</th><th>WR</th><th></th></tr></thead>' +
          '<tbody>' + rows + '</tbody></table>' +
        '</div>' +
      '</div>';
  });

  document.getElementById('page').innerHTML =
    '<div class="pg-hdr"><div class="pg-hdr-inner">' +
      '<a class="back-btn" href="' + hashHref('overview') + '">← Overview</a>' +
      '<div class="pg-hdr-center"><span class="pg-title">' + sLabel(stratId) + '</span>' + pill(regime) + '</div>' +
    '</div></div>' +
    '<div class="pg-body">' +
      // Performance
      '<div class="card"><div class="card-hdr">Performance — Optimised</div><div class="card-body">' +
        '<div class="met-row">' +
          '<div class="m-item"><div class="m-lbl">Calmar</div><div class="m-val neu">' + fmt(calmar,2) + '</div><div class="m-note">Ann. return ÷ max drawdown</div></div>' +
          '<div class="m-item"><div class="m-lbl">Win Rate</div><div class="m-val neu">' + (wr!=null?fmt(wr,1)+'%':'—') + '</div><div class="m-note">% of trades profitable</div></div>' +
          (retPct!=null ? '<div class="m-item"><div class="m-lbl">Return / yr</div><div class="m-val ' + clr(retPct) + '">' + pct(retPct) + '</div><div class="m-note">Annualised on capital</div></div>' : '') +
          '<div class="m-item"><div class="m-lbl">Max Drawdown</div><div class="m-val neg">' + (maxdd?fmt(maxdd,1)+'%':'—') + '</div><div class="m-note">Worst peak-to-trough</div></div>' +
          '<div class="m-item"><div class="m-lbl">Trades</div><div class="m-val neu">' + totalTrades + '</div><div class="m-note">Optimised positions, counted by entry date</div></div>' +
          '<div class="m-item"><div class="m-lbl">Symbols</div><div class="m-val neu">' + syms.length + '</div><div class="m-note">With ≥1 trade</div></div>' +
        '</div>' +
        (combo ? '<div><span style="font-size:10px;color:var(--text3)">Combo: </span><span class="combo-tag">' + combo + '</span></div>' : '') +
      '</div></div>' +
      // Params
      '<div class="card"><div class="card-hdr">Parameters &amp; Risk Management</div><div class="card-body">' + paramsHtml + '</div></div>' +
      // Year bars
      '<div class="card"><div class="card-hdr">Annual Returns — Optimised trades</div><div class="card-body"><div class="yr-bars">' + yrBarsHtml + '</div></div></div>' +
      // Year accordion
      (sortedYrs.length ?
        '<div class="card"><div class="card-hdr">Trades by Year — Optimised positions by entry year</div><div class="card-body" style="padding:8px">' + accordHtml + '</div></div>' :
        '<div style="padding:20px;text-align:center;color:var(--text3)">No trades found.</div>') +
    '</div>';
}

/* ── PARAM EXPLANATION ───────────────────────────── */
function buildParams(stratId, combo, ip, p) {
  // p = exported_params from pipeline (accurate); fall back to combo parsing if absent
  const SL   = p ? p.sl_atr_mult   : 1.5;
  const TP1  = p ? p.tp1_atr_mult  : 3.0;
  const TP2  = p ? p.tp2_atr_mult  : null;   // null = off
  const tp1Pct = p ? Math.round((p.tp1_partial_pct||1)*100) : (combo.includes('tp1_30pct')?30:100);
  const tp2Pct = p ? (p.tp2_partial_pct!=null ? Math.round(p.tp2_partial_pct*100) : null) : (combo.includes('tp2_30pct')?30:null);
  const hasEMA  = p ? !!(p.ema_exit_period) : combo.includes('ema10');
  const emaPer  = p ? (p.ema_exit_period||10) : 10;
  const trailPct = 100 - tp1Pct - (tp2Pct||0);
  const rr1 = SL > 0 ? (TP1/SL).toFixed(1) : '—';
  const rr2 = (TP2 && SL > 0) ? (TP2/SL).toFixed(1) : null;
  const rvol = p ? p.rvol_min : null;
  const rsm  = p ? p.rsm_min  : null;

  let entryRows = '';
  if (stratId === 'ma_cross') {
    const f = p ? (p.fast_period||ip.ma_fast||10) : (ip.ma_fast||10);
    const s = p ? (p.slow_period||ip.ma_slow||20) : (ip.ma_slow||20);
    entryRows =
      row('Fast MA', 'EMA'+f, 'Short-term momentum line. Entry when price crosses above EMA'+f) +
      row('Slow MA', 'SMA'+s, 'Trend filter — only trade when EMA'+f+' > SMA'+s+' (momentum aligned with trend)');
  } else if (stratId === 'bb_squeeze') {
    const kc = p ? (p.kc_mult||ip.kc_mult||2.0) : (ip.kc_mult||2.0);
    entryRows =
      row('Bollinger Band', '20-period ±2σ', 'Volatility envelope. Band = 2 standard deviations from 20-day mean price') +
      row('Keltner Channel', kc+'× ATR', 'ATR-based channel around EMA20. Squeeze = BB inside KC → volatility contracting, coiling for a move') +
      row('Entry Signal', 'Squeeze release', 'Trade when BB expands outside KC — compression breakout with momentum confirmation');
  } else if (stratId === 'reversal') {
    const rsi = ip.rsi_period||14;
    const thr = p ? (p.rsi_threshold||40) : (ip.rsi_threshold||40);
    entryRows =
      row('RSI', 'RSI('+rsi+')', 'Momentum oscillator 0–100. Low value = price fell faster than recent average → potential oversold bounce') +
      row('Oversold Level', '≤ '+thr, 'Entry when RSI ≤ '+thr+'. Price has pulled back enough to be stretched — buying the dip in context of the regime') +
      row('Trend Bias', 'SMA50', 'Confirms regime direction. Prevents buying into strong downtrends without structural support');
  } else if (stratId === 'pivot_breakout') {
    const sw = p ? (p.swing_period||5) : 5;
    entryRows = row('Pivot Breakout', sw+'-bar high', 'Entry above pivot high from past '+sw+' bars — classic range breakout entry');
  }

  // Filters
  if (rvol && rvol > 0) {
    entryRows += row('RVOL Filter', '≥ '+rvol+'× avg', 'Relative volume vs 20-day average. Must exceed '+rvol+'× — confirms breakout has real participation, not a low-volume drift');
  }
  if (rsm && rsm > 0) {
    entryRows += row('RSM Filter', '≥ '+rsm, 'Relative Strength Momentum — ranks stock vs market peers. ≥ '+rsm+' = stock is outperforming the universe (top '+(100-rsm)+'%). Favors leaders, avoids laggards');
  }

  // Risk rows
  let riskRows =
    row('Stop Loss', SL+'× ATR', 'Hard stop. ATR measures recent daily range. If ATR = 1.0 pt, stop is '+SL+' pt below entry. This is 1R — your defined risk per trade') +
    row('TP1 ('+tp1Pct+'% exit)', TP1+'× ATR — '+rr1+':1 R/R', 'First target at '+rr1+'× risk. Exit '+tp1Pct+'% of position here. Guarantees profit on majority before uncertainty grows');
  if (TP2 != null && tp2Pct) {
    riskRows += row('TP2 ('+tp2Pct+'% exit)', TP2+'× ATR — '+rr2+':1 R/R', 'Second target at '+rr2+'× risk. Exit '+tp2Pct+'% here. Captures extended trend move while runner still open');
  }
  if (hasEMA && trailPct > 0) {
    riskRows += row('EMA Trail ('+trailPct+'% exit)', 'EMA'+emaPer+' cross', 'Remaining '+trailPct+'% exits when close drops below EMA'+emaPer+'. No fixed cap — lets big winners compound. Best for trending regimes');
  } else if (!hasEMA) {
    riskRows += row('Full Exit at TP1', '100% position', 'All exits at TP1. Simpler — no partial management, consistent execution');
  }
  riskRows += row('Breakeven Stop', 'Off', 'Stop is NOT moved to entry after partial profit. Full 1R risk stays open. Higher variance but better EV on trend-following strategies');

  return (
    '<div class="param-section">' +
      '<div class="param-sec-title">Entry Signal</div>' +
      '<div class="param-grid">' + entryRows + '</div>' +
    '</div>' +
    '<div class="param-section">' +
      '<div class="param-sec-title">Risk Management</div>' +
      '<div class="param-grid">' + riskRows + '</div>' +
    '</div>'
  );
}
function row(k, v, d) {
  return '<div class="param-row"><span class="pk">'+k+'</span><span class="pv">'+v+'</span><span class="pd">'+d+'</span></div>';
}
