<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Learning Redirect — Alpha Engine</title>
  <meta http-equiv="refresh" content="0; url=index.html#/learning">
</head>
<body>
  <script>
    (function () {
      const hash = window.location.hash.replace(/^#\/?/, '');
      const target = hash ? 'index.html#/' + hash : 'index.html#/learning';
      window.location.replace(target);
    })();
  </script>
  <p>Redirecting to <a href="index.html#/learning">Learning</a>...</p>
</body>
</html>
